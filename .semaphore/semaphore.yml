version: v1.0
name: continuous Integration Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: 'Block #1'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - npm install
        - name: 'Job #2'
          commands:
            - npm install
      env_vars:
        - name: npm
          value: install
  - name: 'Block #2'
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - npm install
